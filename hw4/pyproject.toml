[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-api"
version = "0.1.0"
description = "A FastAPI application"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.117.1",
    "uvicorn>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-dotenv>=1.1.1"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27.2",
    "Faker>=37.8.0",
    "coverage>=7.11.0",
    "pytest==8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.35.0",
    "pytest-asyncio==1.2.0",
    "aiosqlite==0.21.0",
    "certifi==2025.10.5",
    "faker==37.12.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "iniconfig==2.3.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "pygments==2.19.2",
    "tzdata==2025.2",
]

dev = [
    "shop-api[test]",
]

[tool.coverage.run]
branch = true
source = ["shop_api"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]